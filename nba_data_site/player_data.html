<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 NBA 球員數據查詢</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        h2 { color: #E65100; } /* NBA Orange */
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* NBA 風格篩選區 */
        .filter-section { 
            margin-bottom: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            background: #fff3e0; 
            padding: 15px; 
            border-radius: 5px; 
            border-left: 5px solid #E65100;
        }
        select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; min-width: 150px; }
        
        /* 讓表格文字小一點，因為欄位很多 */
        #nbaTable { font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏀 2026 NBA 球員數據即時查詢</h2>
    
    <div class="filter-section">
        <div>
            <label>隊伍 (Team): </label>
            <select id="teamFilter">
                <option value="">全部隊伍</option>
            </select>
        </div>
        <div>
            <label>球員 (Player): </label>
            <select id="playerFilter">
                <option value="">全部球員</option>
            </select>
        </div>
    </div>

    <hr>
    <table id="nbaTable" class="display nowrap" style="width:100%">
        <thead>
            <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 請更換為你 NBA CSV 的實際 Raw 連結
    const csvUrl = 'https://raw.githubusercontent.com/vincentkuo616/nba_data/main/NBA_Players_2025-26.csv';
    let allData = [];
    let table;

    $(document).ready(function() {
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allData = results.data;
                const columns = Object.keys(allData[0]);

                // 1. 動態生成表頭
                let headerHtml = '';
                columns.forEach(col => headerHtml += `<th>${col}</th>`);
                $('#tableHeader').html(headerHtml);

                // 2. 初始化 DataTable
                table = $('#nbaTable').DataTable({
                    data: allData,
                    columns: columns.map(col => ({ data: col })),
                    scrollX: true,
                    pageLength: 10,
                    order: [[14, 'desc']], // 預設依 A_PTS (得分) 降序排列
                    language: {
                        search: "關鍵字搜尋：",
                        lengthMenu: "顯示 _MENU_ 筆",
                        info: "共 _TOTAL_ 位球員數據"
                    }
                });

                // 3. 初始化「隊伍」下拉選單 (NBA 資料 TEAM 在第 3 欄)
                const teams = [...new Set(allData.map(item => item.TEAM))].sort();
                teams.forEach(t => t && $('#teamFilter').append(`<option value="${t}">${t}</option>`));

                // 4. 球隊連動篩選
                $('#teamFilter').on('change', function() {
                    const val = $(this).val();
                    table.column(2).search(val).draw(); // TEAM 的索引是 2
                    updatePlayerOptions(val);
                });

                // 5. 球員篩選
                $('#playerFilter').on('change', function() {
                    table.column(0).search($(this).val()).draw(); // PLAYER 的索引是 0
                });
            }
        });

        function updatePlayerOptions(team) {
            const $playerSelect = $('#playerFilter');
            $playerSelect.html('<option value="">全部球員</option>');

            const filtered = team ? allData.filter(d => d.TEAM === team) : allData;
            const players = [...new Set(filtered.map(item => item.PLAYER))].sort();
            
            players.forEach(p => p && $playerSelect.append(`<option value="${p}">${p}</option>`));
        }
    });
</script>

</body>
</html>
